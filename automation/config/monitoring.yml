# System Monitoring Configuration
monitoring:
  enabled: true
  check_interval: 30  # seconds
  
  # CPU monitoring
  cpu:
    enabled: true
    critical_threshold: 80
    warning_threshold: 70
    alert_on_critical: true
  
  # Memory monitoring
  memory:
    enabled: true
    critical_threshold: 85
    warning_threshold: 75
    alert_on_critical: true
  
  # GPU monitoring (if available)
  gpu:
    enabled: true
    check_nvidia: true
    critical_threshold: 90
    warning_threshold: 80
  
  # Disk monitoring
  disk:
    enabled: true
    critical_threshold: 85
    warning_threshold: 75
    paths_to_monitor:
      - "/"
      - "/home"
      - "/var"
  
  # Service monitoring
  services:
    enabled: true
    check_interval: 60
    services_to_monitor:
      - name: "docker"
        type: "systemd"
        critical: true
      - name: "lmstudio"
        type: "process"
        critical: false
      - name: "nginx"
        type: "systemd"
        critical: false
  
  # Process monitoring
  processes:
    enabled: true
    monitor_list:
      - "python"
      - "node"
      - "java"
    track_top_n: 5  # Top 5 by CPU usage
  
  # Network monitoring
  network:
    enabled: true
    check_bandwidth: true
    critical_latency_ms: 200
  
  # Alerts
  alerts:
    telegram_enabled: true
    send_warnings: true
    send_info: false
    hourly_summary: true
    summary_time: "00"  # Every hour at :00
    critical_immediate: true
    escalation_enabled: true
    escalation_channels:
      - "main_alerts"
      - "critical_alerts"

logging:
  level: "INFO"
  file: "/home/turbo/automation/logs/monitoring.log"
  max_size_mb: 50
  backup_count: 10
  
history:
  enabled: true
  retention_days: 30
  db_file: "/home/turbo/automation/logs/monitoring_history.db"

reporting:
  daily_report: true
  report_time: "07:00"
  weekly_report: true
  weekly_report_day: "monday"
  weekly_report_time: "09:00"
