# LinkedIn Automation Configuration
linkedin:
  enabled: true
  schedule:
    - hour: 9
      minute: 0
    - hour: 14
      minute: 0
    - hour: 19
      minute: 0
  
  # Source de contenu
  content:
    source_file: "/home/turbo/automation/templates/linkedin_content.md"
    retry_max: 3
    timeout: 30
  
  # Engagement settings
  engagement:
    enabled: true
    hashtags_to_follow:
      - "#AI"
      - "#Automation"
      - "#Python"
      - "#DevOps"
      - "#CloudNative"
    engagement_threshold: 50
    like_ratio: 0.7
    comment_ratio: 0.3
  
  # Alerts
  alerts:
    telegram_enabled: true
    engagement_threshold: 50
    daily_report: true
    report_time: "20:00"
  
  # API credentials (à mettre en variables d'env)
  api:
    timeout: 60
    retry_delay: 5
    max_retries: 3

logging:
  level: "INFO"
  file: "/home/turbo/automation/logs/linkedin.log"
  max_size_mb: 10
  backup_count: 5
