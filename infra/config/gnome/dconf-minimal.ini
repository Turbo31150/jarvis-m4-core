[org/gnome/desktop/interface]
clock-show-date=true
clock-show-seconds=true
[org/gnome/desktop/wm/preferences]
action-double-click-titlebar='toggle-maximize'
button-layout='appmenu:minimize,maximize,close'
[org/gnome/mutter]
center-new-windows=true
edge-tiling=false
[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []
[org/gnome/shell]
command-history=['# 1. Charger config réparée\nsource /home/pamerys/.bashrc.new\n\n# 2. Vérifier réparation\necho "TEST OK - Terminal fonctionne!" && ls | head -3', "/bin/sh --norc <<< 'export PS1=\"\\\\u@\\\\h:\\\\w\\\\$ \"; ls'", 'source /home/pamerys/.bashrc.new', 'sudo apt install -y tmux kitty alacritty', '# Charger script de réparation initiale\nsource /home/pamerys/.init-system-repair.sh', 'gnome-terminal -- bash /home/pamerys/.init-system-repair.sh', "bash -c 'export PS1=\"\\\\u@\\\\h:\\\\w\\\\$ \"; export PROMPT_COMMAND=\"\"; echo \"TERMINAL OK\"'", 'echo "TEST OK" && ls | head -2\npwd\nwhoami', 'sudo apt-get update && sudo apt-get install -y tmux kitty alacritty gnome-terminal', 'bash /home/pamerys/download-terminal.sh', '# Installation via apt\nsudo apt-get update && sudo apt-get install -y tmux kitty alacritty gnome-terminal\n\n# Ou installer via le script créé:\nbash /home/pamerys/download-terminal.sh', 'sudo apt install -y gnome-terminal kitty alacritty tmux', "# Force restart du prompt - bypass bloqueur\nexec bash --norc --noprofile <<< 'PS1=\"\\u@\\h:\\w\\$ \"; export PS1; echo \"DEBLOQUE OK\"'\n\n# OU si échec:\nbash -c 'export PS1=\"OK\"; exec bash'", '# Activer module Jarvis vocal\nsource /home/pamerys/.jarv', 'gnome-terminal', 'kitty', 'apt-cache policy 2>/dev/null || echo', 'yum list installed | grep -i terminal 2>/dev/null || echo', 'sudo apt-get update && sudo apt-get install -y tmux kitty gnome-terminal alacritty', 'r']
disable-user-extensions=true
[org/gnome/shell/app-switcher]
current-workspace-only=false

[org/gnome/shell/extensions/GPU_profile_selector]
coolbits=true
force-topbar-view=true
[org/gnome/shell/extensions/appindicator]
icon-opacity=239

[org/gnome/shell/extensions/clipboard-indicator]
paste-on-select=false

[org/gnome/shell/extensions/color-picker]
color-history=[uint32 460551, 12802051]

[org/gnome/shell/extensions/dash-to-dock]
autohide=true
autohide-in-fullscreen=true
[org/gnome/shell/extensions/dev-container-manager]
history='[]'
llm-model='kimi-k2.5:cloud'
[org/gnome/shell/extensions/ding]
check-x11wayland=true
icon-size='large'
[org/gnome/shell/extensions/executor]
location=1

[org/gnome/shell/extensions/extension-list]
