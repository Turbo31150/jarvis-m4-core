version: '3.9'

# 50-business — apps métier/commercial (M4). Démarrage : sites statiques (vitrines).
# deploy : docker stack deploy -c ~/jarvis/stacks/50-business/docker-compose.yml business --with-registry-auth

services:
  alkymia-site:
    image: localhost:5000/50-business/alkymia-site:latest
    ports:
      - "8086:80"
    networks: [jarvis-bus]
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  delmas-site:
    image: localhost:5000/50-business/delmas-site:latest
    ports:
      - "8085:80"
    networks: [jarvis-bus]
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

networks:
  jarvis-bus:
    external: true
