version: '3.9'

# 50-business — apps métier/commercial (PRODUCTION). Sites statiques renforcés.
# deploy : docker stack deploy -c ~/jarvis/stacks/50-business/docker-compose.yml business --with-registry-auth

services:
  alkymia-site:
    image: localhost:5000/50-business/alkymia-site:latest
    ports:
      - "8086:80"
    networks: [jarvis-bus]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 64M }
      restart_policy:
        condition: on-failure

  delmas-site:
    image: localhost:5000/50-business/delmas-site:latest
    ports:
      - "8085:80"
    networks: [jarvis-bus]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: { memory: 64M }
      restart_policy:
        condition: on-failure

networks:
  jarvis-bus:
    external: true
