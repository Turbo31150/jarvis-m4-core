# ─────────────────────────────────────────────────────────────────────────────
# Postiz self-hosted — planificateur de publication réseaux sociaux (souverain)
# JARVIS OS · préparation 2026-08-14 · NE PAS lancer tant que le M4 chauffe.
#
# Postiz = 1 image "tout-en-un" (Next.js frontend + API + workers) + Postgres + Redis.
# Empreinte ~2-3 Gio RAM. À démarrer UNIQUEMENT machine déchargée ou nœud dédié.
#
# Lancement (quand le M4 est froid / ou sur un autre nœud) :
#   cd ~/jarvis/deploy/postiz
#   cp .env.example .env    # puis remplir les valeurs depuis le coffre sops+age
#   docker compose up -d
#
# Ports choisis pour NE PAS entrer en conflit avec la stack JARVIS existante :
#   9000 portainer · 5000 registry · 7777 webapp · 8899 planning · 1234 LMS · 18800 hub
#   → Postiz exposé sur 4200 (hôte) → 5000 (conteneur).
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URLs publiques (adapter au host réel ; localhost par défaut).
      MAIN_URL: "${POSTIZ_MAIN_URL:-http://localhost:4200}"
      FRONTEND_URL: "${POSTIZ_FRONTEND_URL:-http://localhost:4200}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_BACKEND_URL:-http://localhost:4200/api}"
      # Secret de session — JAMAIS en clair ici : fourni via .env (coffre sops+age).
      JWT_SECRET: "${POSTIZ_JWT_SECRET:?JWT_SECRET manquant — voir .env.example / coffre sops+age}"
      # Bases internes (branchées sur les services ci-dessous).
      DATABASE_URL: "postgresql://${POSTIZ_DB_USER:-postiz}:${POSTIZ_DB_PASSWORD:?DB password manquant}@postiz-postgres:5432/${POSTIZ_DB_NAME:-postiz}"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
    ports:
      - "4200:5000"
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    # Garde-fou RAM : le conteneur applicatif est le plus gourmand.
    mem_limit: 2g
    networks:
      - postiz

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTIZ_DB_USER:-postiz}"
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD:?DB password manquant — voir .env.example / coffre sops+age}"
      POSTGRES_DB: "${POSTIZ_DB_NAME:-postiz}"
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTIZ_DB_USER:-postiz} -d ${POSTIZ_DB_NAME:-postiz}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m
    networks:
      - postiz

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - postiz-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    networks:
      - postiz

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:

networks:
  postiz:
    name: postiz
